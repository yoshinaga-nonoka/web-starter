<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>デザイン案ボード</title>
<!-- 案を PC（1440×900）とスマホ（390×844）で並べて1枚にする。
     使い方: http://127.0.0.1:5482/design/_board/board.html?p=/design/hero/a.html&t=A案 丸窓
     今のサイトを並べる: ?p=http://127.0.0.1:5481/ （npm run serve で dist を配信しておく）
     撮る:   npm run shot -- "http://127.0.0.1:5482/design/_board/board.html?p=/design/hero/a.html&t=A案" --sizes 1600x900 --as design/hero/out/board-a.jpg --wait 4000 -->
<style>
  body { margin: 0; background: #e9e4dc; font-family: "Hiragino Sans", sans-serif; color: #2f2a24; }
  .board { display: grid; grid-template-columns: auto auto; gap: 40px; align-items: start; justify-content: center; padding: 48px 40px 40px; }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .06em; }
  figure { margin: 0; }
  figcaption { font-size: 13px; color: #6f655a; margin-bottom: 8px; }
  .screen { overflow: hidden; border-radius: 12px; box-shadow: 0 12px 36px -12px rgb(0 0 0 / .35); background: #fff; }
  .screen iframe { border: 0; transform-origin: 0 0; display: block; }
  .pc .screen { width: 1008px; height: 630px; }
  .pc iframe { width: 1440px; height: 900px; transform: scale(.7); }
  .sp .screen { width: 273px; height: 591px; border-radius: 28px; }
  .sp iframe { width: 390px; height: 844px; transform: scale(.7); }
</style>
</head>
<body>
<div class="board">
  <h1 id="t"></h1>
  <figure class="pc"><figcaption>PC 1440×900</figcaption><div class="screen"><iframe id="pc" title="PC"></iframe></div></figure>
  <figure class="sp"><figcaption>スマホ 390×844</figcaption><div class="screen"><iframe id="sp" title="スマホ"></iframe></div></figure>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const p = q.get('p') || '/';
  document.getElementById('t').textContent = q.get('t') || p;
  document.getElementById('pc').src = p;
  document.getElementById('sp').src = p;
</script>
</body>
</html>
