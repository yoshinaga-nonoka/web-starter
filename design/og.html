<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OGP画像</title>
<!-- SNSで共有されたときの画像（1200×630）。店名・ひとこと・写真を差し替えて撮る:
     npm run serve:design &
     npm run shot -- http://127.0.0.1:5482/design/og.html --sizes 1200x630 --as public/media/og.jpg
     ロゴの PNG（512px）: npm run shot -- http://127.0.0.1:5482/public/media/logo.svg --sizes 512x512 --as public/media/logo.png -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 520px; background: #faf6f0; color: #2f2a24; font-family: "Zen Old Mincho", serif; }
  .copy { display: grid; align-content: center; gap: 28px; padding: 0 72px; }
  .copy img { width: 88px; height: 88px; }
  .name { font-size: 64px; letter-spacing: .08em; margin: 0; }
  .line { font-size: 28px; color: #6f655a; margin: 0; }
  .photo { background: url(/public/media/placeholder-hero.svg) center / cover; border-radius: 260px 260px 0 0; margin: 48px 48px 0 0; }
</style>
</head>
<body>
  <div class="copy">
    <img src="/public/media/logo.svg" alt="">
    <p class="name">サンプル食堂</p>
    <p class="line">まちの小さな食堂</p>
  </div>
  <div class="photo"></div>
</body>
</html>
